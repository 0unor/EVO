<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVO - Admin Panel</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>

        :root { --bg: #050505; --panel: rgba(15, 23, 42, 0.9); --accent: #22d3ee; --red: #f43f5e; --green: #4ade80; --yellow: #eab308; }
        body {
            background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif;
            margin: 0; height: 100vh; overflow: hidden; user-select: none;
        }

        .nav {
            width: 100%; padding: 15px 30px; background: #0f172a; display: flex;
            justify-content: space-between; box-sizing: border-box;
            border-bottom: 1px solid #334155; z-index: 100; position: relative;
        }
        .nav span { color: #94a3b8; font-size: 1.2em; letter-spacing: 3px; font-weight: 700; }
        .nav a { color: var(--accent); text-decoration: none; font-weight: 700; font-size: 1.2em; letter-spacing: 2px; }

        .main-container {
            position: relative; width: 100vw; height: calc(100vh - 60px); display: flex;
            justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #050505 100%);
        }

        #video-feed { max-width: 95vw; max-height: 85vh; border: 2px solid #334155; border-radius: 10px; }

        .hud-overlay {
            position: absolute; background: var(--panel); padding: 0; border-radius: 12px;
            border: 1px solid #334155; border-left: 4px solid var(--accent);
            backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 50; cursor: default;
        }

        .hud-header {
            padding: 10px 20px; background: rgba(255, 255, 255, 0.05); cursor: move; font-weight: 700;
            letter-spacing: 2px; color: var(--accent); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; justify-content: space-between; align-items: center;
        }

        .hud-content { padding: 20px; }
        #telemetry-panel { top: 30px; left: 30px; width: 220px; }
        #controls-panel { top: 30px; right: 30px; width: 340px; }

        .stat-line { font-size: 1.3em; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .stat-val { color: var(--green); font-weight: 700; }

        .toggle-btn { width: 100%; padding: 10px; background: #334155; border: 1px solid var(--accent); color: white; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: 700; margin-bottom: 10px; transition: 0.2s;}
        .toggle-btn.active { background: var(--accent); color: #0f172a; }
        .reset-btn { width: 100%; padding: 12px; background: var(--red); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 10px; }

        .joystick-row { display: flex; gap: 15px; margin-top: 15px; }
        .joystick-box { flex: 1; text-align: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; border: 1px solid #334155; }
        .pad { width: 130px; height: 130px; background: #0f172a; border-radius: 50%; position: relative; margin: 10px auto; cursor: crosshair; touch-action: none; border: 2px solid #334155; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        .handle { width: 25px; height: 25px; background: var(--accent); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px var(--accent); pointer-events: none; }
        .val-display { color: var(--accent); font-weight: 700; display: block; margin-top: 5px; font-size: 0.9em; }

        .slider-container { margin-bottom: 15px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.9em; color: #94a3b8; margin-bottom: 5px; }
        .slider-val { color: var(--accent); font-weight: bold; }
        .slider { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; background: #334155; outline: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 10px var(--accent); }
    </style>
</head>
<body>

    <div class="nav">
        <span>EVO_OS // SYSTEM_ADMINISTRATION</span>
        <a href="/">[ EXIT TO MENU ]</a>
    </div>

    <!-- Settings HUD -->
        <div id="settings-panel" class="hud-overlay" style="top: 30px; left: 270px; width: 300px;">
            <div class="hud-header">SENSITIVITY <span>⠿</span></div>
            <div class="hud-content">

                <div class="slider-container">
                    <div class="slider-label"><span>LEFT Threshold (X Min)</span> <span class="slider-val" id="val_x_min">0.40</span></div>
                    <input type="range" min="0.20" max="0.50" step="0.01" value="0.40" class="slider" id="x_min" oninput="updateSettings()">
                </div>

                <div class="slider-container">
                    <div class="slider-label"><span>RIGHT Threshold (X Max)</span> <span class="slider-val" id="val_x_max">0.65</span></div>
                    <input type="range" min="0.50" max="0.80" step="0.01" value="0.65" class="slider" id="x_max" oninput="updateSettings()">
                </div>

                <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">

                <div class="slider-container">
                    <div class="slider-label"><span>UP Threshold (Y Min)</span> <span class="slider-val" id="val_y_min">0.35</span></div>
                    <input type="range" min="0.15" max="0.45" step="0.01" value="0.35" class="slider" id="y_min" oninput="updateSettings()">
                </div>

                <div class="slider-container">
                    <div class="slider-label"><span>DOWN Threshold (Y Max)</span> <span class="slider-val" id="val_y_max">0.55</span></div>
                    <input type="range" min="0.45" max="0.75" step="0.01" value="0.55" class="slider" id="y_max" oninput="updateSettings()">
                </div>

            </div>
        </div>

    <div class="main-container">
        <img id="video-feed" src="/video_feed" onerror="this.src='https://via.placeholder.com/800x600/1e293b/22d3ee?text=STREAM+PAUSED'">

        <div id="telemetry-panel" class="hud-overlay">
            <div class="hud-header">LIVE_DATA <span>⠿</span></div>
            <div class="hud-content">
                <div class="stat-line">CPU: <span class="stat-val" id="cpu">--</span>%</div>
                <div class="stat-line">RAM: <span class="stat-val" id="ram">--</span>%</div>
                <div class="stat-line">TEMP: <span class="stat-val" id="temp">--</span>°C</div>
                <div class="stat-line">RELAY: <span class="stat-val" id="relay-status" style="color: var(--red);">OFF</span></div>
            </div>
        </div>

        <div id="controls-panel" class="hud-overlay">
            <div class="hud-header">EYE_CONTROLS <span>⠿</span></div>
            <div class="hud-content">

                <button id="relayBtn" class="toggle-btn" style="border-color: var(--yellow); color: var(--yellow);" onclick="manualToggleRelay()">⚡ MANUAL RELAY: OFF</button>
                <button id="linkBtn" class="toggle-btn" onclick="toggleLink()">🔗 LINK EYES: OFF</button>

                <div class="joystick-row">
                    <div class="joystick-box">
                        <label style="font-size: 0.8em; color: #94a3b8;">LEFT EYE</label>
                        <div id="pad0" class="pad"><div id="handle0" class="handle"></div></div>
                        <span class="val-display" id="val0">X: 90° | Y: 90°</span>
                    </div>
                    <div class="joystick-box">
                        <label style="font-size: 0.8em; color: #94a3b8;">RIGHT EYE</label>
                        <div id="pad1" class="pad"><div id="handle1" class="handle"></div></div>
                        <span class="val-display" id="val1">X: 90° | Y: 90°</span>
                    </div>
                </div>

                <button class="reset-btn" onclick="resetAll()">🔄 RESET ALL SERVOS</button>
            </div>
        </div>
    </div>

    <script>
       // --- 1. DRAG PANEL LOGIC ---
        let highestZ = 100;
        function makeDraggable(el) {
            if (!el) return;
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const header = el.querySelector('.hud-header');

            el.onmousedown = () => { highestZ++; el.style.zIndex = highestZ; };
            header.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e.preventDefault(); pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = closeDragElement; document.onmousemove = elementDrag;
            }
            function elementDrag(e) {
                e.preventDefault(); pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
                pos3 = e.clientX; pos4 = e.clientY;
                el.style.top = (el.offsetTop - pos2) + "px"; el.style.left = (el.offsetLeft - pos1) + "px";
                el.style.right = "auto";
            }
            function closeDragElement() { document.onmouseup = null; document.onmousemove = null; }
        }

        makeDraggable(document.getElementById("telemetry-panel"));
        makeDraggable(document.getElementById("controls-panel"));
        makeDraggable(document.getElementById("settings-panel"));

        // --- 2. RELAY LOGIC ---
        function manualToggleRelay() {
            fetch('/api/toggle_relay', { method: 'POST' })
            .then(r => r.json())
            .then(data => updateRelayUI(data.relay_state))
            .catch(e => console.error(e));
        }

        function updateRelayUI(isOn) {
            const btn = document.getElementById('relayBtn');
            const status = document.getElementById('relay-status');
            if (isOn) {
                btn.innerText = "⚡ MANUAL RELAY: ON";
                btn.style.background = "var(--yellow)";
                btn.style.color = "#0f172a";
                status.innerText = "ON";
                status.style.color = "var(--green)";
            } else {
                btn.innerText = "⚡ MANUAL RELAY: OFF";
                btn.style.background = "#334155";
                btn.style.color = "var(--yellow)";
                status.innerText = "OFF";
                status.style.color = "var(--red)";
            }
        }

        // --- 3. SETTINGS LOGIC ---
        fetch('/api/settings').then(r => r.json()).then(data => {
            if(data.x_min !== undefined) {
                document.getElementById('x_min').value = data.x_min; document.getElementById('val_x_min').innerText = data.x_min.toFixed(2);
                document.getElementById('x_max').value = data.x_max; document.getElementById('val_x_max').innerText = data.x_max.toFixed(2);
                document.getElementById('y_min').value = data.y_min; document.getElementById('val_y_min').innerText = data.y_min.toFixed(2);
                document.getElementById('y_max').value = data.y_max; document.getElementById('val_y_max').innerText = data.y_max.toFixed(2);
            }
        }).catch(e => console.log("Settings nem töltött be (szerver hiba)"));

        let settingTimeout;
        function updateSettings() {
            const payload = {
                x_min: parseFloat(document.getElementById('x_min').value),
                x_max: parseFloat(document.getElementById('x_max').value),
                y_min: parseFloat(document.getElementById('y_min').value),
                y_max: parseFloat(document.getElementById('y_max').value)
            };

            document.getElementById('val_x_min').innerText = payload.x_min.toFixed(2);
            document.getElementById('val_x_max').innerText = payload.x_max.toFixed(2);
            document.getElementById('val_y_min').innerText = payload.y_min.toFixed(2);
            document.getElementById('val_y_max').innerText = payload.y_max.toFixed(2);

            clearTimeout(settingTimeout);
            settingTimeout = setTimeout(() => {
                fetch('/api/settings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                }).catch(e => console.error(e));
            }, 100);
        }

        // --- 4. JOYSTICK & SERVO LOGIC ---
        let eyesLinked = false;
        let lastServoUpdate = 0;
        let lastPayloadStr = "";

        function toggleLink() {
            eyesLinked = !eyesLinked;
            const btn = document.getElementById('linkBtn');
            btn.innerText = eyesLinked ? "🔗 LINK EYES: ON" : "🔗 LINK EYES: OFF";
            btn.classList.toggle('active', eyesLinked);
        }

        function updateHandle(id, xPercent, yPercent) {
            const angleX = Math.round(xPercent * 180);
            const angleY = Math.round(yPercent * 180);

            document.getElementById('handle' + id).style.left = (xPercent * 100) + '%';
            document.getElementById('handle' + id).style.top = (yPercent * 100) + '%';
            document.getElementById('val' + id).innerText = `X: ${angleX}° | Y: ${angleY}°`;

            if (eyesLinked) {
                const other = id === 0 ? 1 : 0;
                document.getElementById('handle' + other).style.left = (xPercent * 100) + '%';
                document.getElementById('handle' + other).style.top = (yPercent * 100) + '%';
                document.getElementById('val' + other).innerText = `X: ${angleX}° | Y: ${angleY}°`;
            }

            let payload = [
                { channel: id === 0 ? 0 : 4, angle: angleX },
                { channel: id === 0 ? 1 : 5, angle: angleY }
            ];

            if (eyesLinked) {
                const other = id === 0 ? 1 : 0;
                payload.push({ channel: other === 0 ? 0 : 4, angle: angleX });
                payload.push({ channel: other === 0 ? 1 : 5, angle: angleY });
            }

            const currentPayloadStr = JSON.stringify(payload);
            if (currentPayloadStr === lastPayloadStr) return;
            if (Date.now() - lastServoUpdate < 100) return;

            lastServoUpdate = Date.now();
            lastPayloadStr = currentPayloadStr;

            fetch('/api/servo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: currentPayloadStr
            }).catch(e => {});
        }

        function setupJoystick(id) {
            const pad = document.getElementById('pad' + id);
            if(!pad) return;
            pad.onmousedown = (e) => {
                const move = (ev) => {
                    const rect = pad.getBoundingClientRect();
                    const xPercent = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
                    const yPercent = Math.max(0, Math.min(1, (ev.clientY - rect.top) / rect.height));
                    updateHandle(id, xPercent, yPercent);
                };
                move(e);
                document.onmousemove = move;
                document.onmouseup = () => { document.onmousemove = null; };
            };
        }
        setupJoystick(0);
        setupJoystick(1);

        // --- 5. TELEMETRY & RESET ---
        function resetAll() {
            fetch('/api/reset', { method: 'POST' }).then(() => {
                updateHandle(0, 0.5, 0.5);
                updateHandle(1, 0.5, 0.5);
            });
        }

        setInterval(() => {
            fetch('/api/telemetry')
            .then(r => r.json())
            .then(d => {
                document.getElementById('cpu').innerText = d.cpu;
                document.getElementById('ram').innerText = d.ram;
                document.getElementById('temp').innerText = d.temp;
                updateRelayUI(d.relay);
            }).catch(e => {});
        }, 1000);
    </script>
</body>
</html>
